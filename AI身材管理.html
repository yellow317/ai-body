<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 健康饮食</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 30%, #0f172a 60%, #1a1a2e 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 56px 40px;
    text-align: center;
    max-width: 380px;
    width: 90%;
    animation: fadeIn 0.6s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .emoji { font-size: 56px; margin-bottom: 20px; }
  h1 { font-size: 24px; color: #f1f5f9; margin-bottom: 8px; }
  p { font-size: 14px; color: #64748b; margin-bottom: 36px; line-height: 1.6; }
  .btn {
    display: inline-block;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    padding: 14px 64px;
    border-radius: 14px;
    text-decoration: none;
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(59,130,246,0.35);
    border: none;
    cursor: pointer;
    letter-spacing: 2px;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(59,130,246,0.5);
  }
</style>
</head>
<body>
<div class="card">
  <div class="emoji">🏋️</div>
  <h1>AI 健康饮食</h1>
  <p>科学饮食 · 健康生活 · AI 个性化指导</p>
  <a href="https://aibody-web.pages.dev" class="btn">进 入</a>
</div>
</body>
</html>
