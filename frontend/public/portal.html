<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 健康饮食</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 30%, #0f172a 60%, #1a1a2e 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Animated background orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.3;
    animation: float 8s ease-in-out infinite;
  }
  .orb-1 { width: 400px; height: 400px; background: #3b82f6; top: -100px; right: -80px; animation-delay: 0s; }
  .orb-2 { width: 300px; height: 300px; background: #8b5cf6; bottom: -80px; left: -60px; animation-delay: -3s; }
  .orb-3 { width: 250px; height: 250px; background: #06b6d4; top: 50%; left: 50%; animation-delay: -5s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -30px) scale(1.05); }
    66% { transform: translate(-20px, 20px) scale(0.95); }
  }

  /* Card */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 28px;
    padding: 56px 48px;
    text-align: center;
    max-width: 420px;
    width: 90%;
    animation: slideUp 0.8s ease-out;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-size: 40px;
    box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
  }

  .title {
    font-size: 28px;
    font-weight: 700;
    color: #f1f5f9;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 15px;
    color: #94a3b8;
    margin-bottom: 36px;
    line-height: 1.6;
  }

  .features {
    display: flex;
    gap: 24px;
    justify-content: center;
    margin-bottom: 40px;
  }

  .feature {
    text-align: center;
  }
  .feature .icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin: 0 auto 8px;
  }
  .feature .icon.green { background: rgba(34, 197, 94, 0.15); }
  .feature .icon.blue  { background: rgba(59, 130, 246, 0.15); }
  .feature .icon.purple { background: rgba(139, 92, 246, 0.15); }
  .feature .label { font-size: 12px; color: #94a3b8; }

  .enter-btn {
    display: inline-block;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    padding: 14px 56px;
    border-radius: 16px;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(59, 130, 246, 0.35);
    letter-spacing: 2px;
  }
  .enter-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(59, 130, 246, 0.5);
  }
  .enter-btn:active {
    transform: translateY(0);
  }

  .footer {
    margin-top: 32px;
    font-size: 12px;
    color: #475569;
  }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="card">
  <div class="avatar">🏋️</div>
  <h1 class="title">AI 健康饮食</h1>
  <p class="subtitle">基于你的身体数据，AI 提供个性化的<br>饮食建议与健康指导</p>

  <div class="features">
    <div class="feature">
      <div class="icon green">📊</div>
      <span class="label">数据分析</span>
    </div>
    <div class="feature">
      <div class="icon blue">🤖</div>
      <span class="label">AI 教练</span>
    </div>
    <div class="feature">
      <div class="icon purple">📷</div>
      <span class="label">食物识别</span>
    </div>
  </div>

  <a href="/" class="enter-btn">进 入</a>

  <p class="footer">科学饮食 · 健康生活 · 持之以恒</p>
</div>

</body>
</html>
